<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <h1>My To-Do List</h1>
      <p>Stay organized. Get things done.</p>
    </header>

    <form id="taskForm" class="input-row">
      <input id="taskInput" type="text" placeholder="What needs to be done?" maxlength="120" autocomplete="off" required>
      <button type="submit">Add</button>
    </form>

    <div class="toolbar">
      <div class="filters">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="active">Active</button>
        <button class="filter" data-filter="completed">Completed</button>
      </div>
      <button id="clearCompleted" class="text-button">Clear completed</button>
    </div>

    <ul id="taskList" class="task-list"></ul>
    <div id="emptyState" class="empty">No tasks yet. Add one above!</div>

    <footer>
      <span id="taskCount">0 tasks</span>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
